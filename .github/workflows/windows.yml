name: Build WordCraft Hebrew Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check Rust version
        shell: pwsh
        run: |
          rustc --version
          cargo --version

          $version = (rustc --version).Split(' ')[1]
          if ([version]$version -lt [version]"1.95.0") {
            throw "Rust 1.95 or newer is required"
          }

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build WordCraft Hebrew
        shell: pwsh
        run: |
          cargo build `
            --release `
            --locked `
            --package wordcraft `
            --target x86_64-pc-windows-msvc

      - name: Package Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          $releasePath = "target/x86_64-pc-windows-msvc/release"

          $exeFiles = Get-ChildItem `
            -Path $releasePath `
            -Filter "*.exe" `
            -File

          if (-not $exeFiles) {
            throw "No Windows EXE files found"
          }

          foreach ($file in $exeFiles) {
            Copy-Item $file.FullName -Destination dist/
          }

          Write-Host "Windows EXE files:"
          Get-ChildItem dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Hebrew-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
