name: Build WordCraft Windows

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build WordCraft
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path apps/wordcraft/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Package Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          Get-ChildItem "target/x86_64-pc-windows-msvc/release" -Filter "*.exe" -File |
            Copy-Item -Destination dist/

          if (-not (Get-ChildItem dist -Filter "*.exe" -File)) {
            throw "No EXE files found"
          }

          Get-ChildItem dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Hebrew-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
EOF
